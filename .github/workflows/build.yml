# ============================================================
#  Baut die Firmware automatisch bei jedem Hochladen (Push).
#  - Ergebnis zum Herunterladen unter "Actions" -> Lauf anklicken -> Artifacts
#  - Bei einem Versions-Tag (z.B. v1.0.0) entsteht ein Release mit den Dateien
#  - Der Online-Flasher (GitHub Pages) wird mit der neuesten Firmware aktualisiert
# ============================================================
name: Firmware bauen

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'include/**', 'platformio.ini', 'docs/**', '.github/**']
  pull_request:
    paths: ['src/**', 'include/**', 'platformio.ini', 'docs/**', '.github/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bauen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PlatformIO-Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: PlatformIO und esptool installieren
        run: pip install platformio esptool==4.8.1

      - name: Firmware bauen
        run: pio run -e esp32cam

      - name: Alles in eine Datei packen (fuer den Online-Flasher)
        run: |
          B=.pio/build/esp32cam
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n 1)
          mkdir -p ausgabe
          # ESP32 (klassisch): Bootloader liegt bei 0x1000, nicht bei 0x0
          python -m esptool --chip esp32 merge_bin -o ausgabe/espcam-komplett.bin \
            --flash_mode dio --flash_size 4MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          # Einzelteile fuer das Flasher-Update (ueberschreibt die gespeicherten WLANs NICHT)
          mkdir -p ausgabe/teile
          cp $B/bootloader.bin $B/partitions.bin "$BOOT_APP0" $B/firmware.bin ausgabe/teile/
          ls -la ausgabe ausgabe/teile

      - name: Ergebnis aufheben
        uses: actions/upload-artifact@v4
        with:
          name: espcam-firmware
          path: ausgabe/

      - name: Release anlegen (nur bei Versions-Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ausgabe/espcam-komplett.bin
            ausgabe/teile/firmware.bin
          generate_release_notes: true

      - name: Online-Flasher vorbereiten
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p seite
          cp -r docs/* seite/
          cp ausgabe/espcam-komplett.bin seite/
          cp ausgabe/teile/* seite/
          sed -i "s/__VERSION__/Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})/" seite/manifest-*.json seite/index.html
          ls -la seite

      - name: Flasher-Seite hochladen
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: seite

  flasher:
    needs: bauen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
